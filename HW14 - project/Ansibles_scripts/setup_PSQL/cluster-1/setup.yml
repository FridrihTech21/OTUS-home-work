---
- name: Configure etcd cluster
  hosts: servers
  become: yes
  gather_facts: yes

  tasks:
    - name: Install python3-pip
      ansible.builtin.apt:
        name: python3-pip
        update_cache: yes
        state: present
    - name: Install python3-psycopg2
      ansible.builtin.apt:
        name: python3-psycopg2
        update_cache: yes
        state: present       
    - name: Install postgresql-server
      ansible.builtin.apt:
        name: postgresql
        update_cache: yes
        state: present
    - name: Grant all all from network 0.0.0.0/0 access 
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/16/main/pg_hba.conf
        contype: host
        users: all
        source: 0.0.0.0/0
        databases: all
        method: scram-sha-256
    - name: Grant all postgres from local access 
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/16/main/pg_hba.conf
        contype: local
        users: postgres
        databases: all
        method: trust
    - name: Grant replicator replicator from host access 
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/16/main/pg_hba.conf
        contype: host
        users: replicator
        source: 0.0.0.0/0
        databases: replicator
        method: scram-sha-256
    - name: Replace a listen_addresses = '*'
      ansible.builtin.lineinfile:
        path: /etc/postgresql/16/main/postgresql.conf
        search_string: '#listen_addresses' 
        line: listen_addresses = '*'  
    - name: Restart PostgreSQL service
      ansible.builtin.systemd_service:
        name: postgresql.service
        state: restarted
      become: yes
    - name: Delete if exist user replicator
      community.postgresql.postgresql_query:
        login_db: postgres
        query: drop user if exists replicator
    - name: Create user replicator
      community.postgresql.postgresql_query:
        login_db: postgres
        query: create user replicator login encrypted password 'password'
    - name: Stopped PostgreSQL service
      ansible.builtin.systemd_service:
        name: postgresql.service
        state: stopped
      become: yes
    - name: Recursively remove directory
      ansible.builtin.file:
        path: /var/lib/postgresql/16/main/
        state: absent
      become: yes
